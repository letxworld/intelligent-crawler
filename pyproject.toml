[project]
name = "intelligent-crawler"
version = "0.1.0"
description = "A CLI-based intelligent web crawler tool for authorized bug bounty reconnaissance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "letxworld" }]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
